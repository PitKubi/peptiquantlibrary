# /etc/nginx/sites-available/peptiquantlibrary
# certbot --nginx -d peptiquantlibrary.com -d www.peptiquantlibrary.com
# rewrites this block for TLS after the first issue.
server {
    listen 80;
    server_name peptiquantlibrary.com www.peptiquantlibrary.com;

    location /static/ {
        alias /home/peter/peptiquantlibrary/static_root/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
